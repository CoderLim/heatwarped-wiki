<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Heatwarped Wiki">
  <!-- Heatwarped Wiki — Ratfield Night favicon: flaming angular H -->
  <defs>
    <linearGradient id="heatBar" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="30%" stop-color="#ffb066"/>
      <stop offset="65%" stop-color="#f4551a"/>
      <stop offset="100%" stop-color="#c22f10"/>
    </linearGradient>
    <linearGradient id="heatCross" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff916a"/>
      <stop offset="55%" stop-color="#ff6a3a"/>
      <stop offset="100%" stop-color="#e85d3a"/>
    </linearGradient>
    <linearGradient id="cyberSwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1782a8"/>
      <stop offset="55%" stop-color="#3ee0ff"/>
      <stop offset="100%" stop-color="#c9f6ff"/>
    </linearGradient>
    <radialGradient id="plateBg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#12172a"/>
      <stop offset="100%" stop-color="#05060c"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#plateBg)" stroke="rgba(148,158,186,0.28)" stroke-width="1.5"/>

  <!-- energy swoosh behind the H -->
  <path d="M 34 52 C 44 54, 54 46, 56 36" fill="none" stroke="url(#cyberSwoosh)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" opacity="0.9"/>

  <!-- angular italic H -->
  <g filter="url(#softGlow)">
    <g transform="skewX(-7)">
      <rect x="19" y="15" width="9" height="34" rx="1.5" fill="url(#heatBar)"/>
      <rect x="38" y="15" width="9" height="34" rx="1.5" fill="url(#heatBar)"/>
    </g>
    <polygon points="21,29 43,29 43,36 21,36" fill="url(#heatCross)"/>
  </g>

  <!-- flame lick on the left stem -->
  <g filter="url(#softGlow)">
    <path d="M 18 16 C 14 12, 17 8, 21 6 C 19 10, 23 11, 24 15 C 25 18, 22 19, 21 17 Z" fill="#ffd166" opacity="0.95"/>
    <circle cx="15" cy="20" r="1.6" fill="#ffb066"/>
    <circle cx="24" cy="9" r="1.3" fill="#ffe08a"/>
  </g>

  <!-- ember sparks -->
  <circle cx="47" cy="14" r="1.5" fill="#ff916a" opacity="0.85"/>
  <circle cx="51" cy="20" r="1.1" fill="#ffd166" opacity="0.7"/>
</svg>
