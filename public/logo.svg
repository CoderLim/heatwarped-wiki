<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Heatwarped Wiki">
  <!-- Heatwarped Wiki — Ratfield Night brand mark: racing chevrons -->
  <defs>
    <linearGradient id="lgHeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb066"/>
      <stop offset="55%" stop-color="#ff6a3a"/>
      <stop offset="100%" stop-color="#d24220"/>
    </linearGradient>
    <linearGradient id="lgCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1782a8"/>
      <stop offset="60%" stop-color="#3ee0ff"/>
      <stop offset="100%" stop-color="#c9f6ff"/>
    </linearGradient>
    <radialGradient id="lgPlate" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#12172a"/>
      <stop offset="100%" stop-color="#05060c"/>
    </radialGradient>
    <filter id="lgGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#lgPlate)" stroke="rgba(148,158,186,0.28)" stroke-width="1.5"/>

  <!-- three skewed speed chevrons: heat / cyan / deep heat -->
  <g filter="url(#lgGlow)" transform="skewX(-12)">
    <path d="M 20 18 h 10 l -7 13 h -10 Z" fill="url(#lgHeat)"/>
    <path d="M 33 18 h 10 l -7 13 h -10 Z" fill="url(#lgCyan)"/>
    <path d="M 46 18 h 10 l -7 13 h -10 Z" fill="url(#lgHeat)" opacity="0.55"/>
    <path d="M 26.5 34 h 10 l -7 12 h -10 Z" fill="url(#lgHeat)" opacity="0.8"/>
    <path d="M 39.5 34 h 10 l -7 12 h -10 Z" fill="url(#lgCyan)" opacity="0.45"/>
  </g>

  <!-- road line -->
  <path d="M 14 52 H 50" stroke="rgba(148,158,186,0.4)" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
</svg>
